name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      # npm 10 (bundled with node 22) crashes resolving vitest's peer deps.
      - if: matrix.node-version == 22
        run: npm install -g npm@11
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm test
